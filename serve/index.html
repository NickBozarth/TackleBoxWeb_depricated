<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Here we aree</title>
</head>

<body>
    <h1>header</h1>

    <div id="login-signup">
        <h3>Login</h3>

        <form id="login-form">
            <input type="text" name="username" placeholder="Username" />
            <input type="text" name="password" placeholder="Password" />
            <button type="submit">Submit</button>
            <button class="toggle-form">Toggle</button>
        </form>

        <form id="signup-form" hidden>
            <input type="text" name="username" placeholder="Username" />
            <input type="text" name="password" placeholder="Password" />
            <button type="submit">Submit</button>
            <button class="toggle-form">Toggle</button>
        </form>
    </div>

    <br><br><br>

    <div id="new-tackle-button">
        <button>New Tackle</button>
    </div>
    <div id="new-tackle-form" hidden>
        <h3>New Tackle</h3>
        <form action="" id="new-tackle">
            <input type="text" name="" id="" placeholder="Name"><br><br>
            <input type="text"name="" id="" placeholder="Description (optional)"><br><br>
            <select name="" id=""></select><br><br>
            <div id="data">
                <input type="text" placeholder="Text" class="text">
                <input type="file" class="file">
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    
</body>

<script src="result.js"></script>
<script src="rsa.js"></script>
<script src="login.js"></script>
<script src="new_tackle.js"></script>


</html>
